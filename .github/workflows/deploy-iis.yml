name: Build & Deploy to IIS (Self-hosted)

on:
  push:
    branches: [ "master" ]   # deploy når du pusher til main
  workflow_dispatch:       # mulighed for manuel kørsel

jobs:
  deploy:
    # Kør PÅ DIN VM (self-hosted), ikke GitHub's egne build-agenter
    runs-on: self-hosted

    env:
      CONFIGURATION: Release
      PUBLISH_DIR: C:\_deploy
      API_PROJECT: .\Sommerhus.Api\Sommerhus.Api.csproj
      MVC_PROJECT: .\Sommerhus.Mvc\Sommerhus.Mvc.csproj
      API_SITE_ROOT: C:\WebServer\api_c1_vh_mms.smedt.dk\1.0.0\publish
      MVC_SITE_ROOT: C:\WebServer\mvc_c1_vh_mms.smedt.dk\1.0.0\publish
      API_APPPOOL: SommerhusApiPool
      MVC_APPPOOL: SommerhusMvcPool
      DatabaseProvider: Sqlite
      ConnectionStrings__Default: 'Data Source=C:\Data\Sommerhus\api\db\sommerhus.db'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure publish dir exists
        shell: pwsh
        run: |
          if (!(Test-Path $env:PUBLISH_DIR)) { New-Item -ItemType Directory -Path $env:PUBLISH_DIR | Out-Null }
          Write-Host "Using publish dir: $env:PUBLISH_DIR"
    
      - name: Who am I (runner identity)?
        run: whoami

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration $env:CONFIGURATION --no-restore

      - name: Clean previous publish directory
        shell: pwsh
        run: |
          if (Test-Path $env:PUBLISH_DIR) {
            Write-Host "Cleaning directory: $env:PUBLISH_DIR"
            Remove-Item -Path $env:PUBLISH_DIR -Recurse -Force
          }
          New-Item -ItemType Directory -Path $env:PUBLISH_DIR | Out-Null

      - name: Publish API
        run: |
          dotnet publish $env:API_PROJECT -c $env:CONFIGURATION `
            --no-self-contained /p:CopyLocalLockFileAssemblies=true `
            -o "$env:PUBLISH_DIR\Sommerhus.Api"

      - name: Publish MVC
        run: >
          dotnet publish $env:MVC_PROJECT -c $env:CONFIGURATION
          -o "$env:PUBLISH_DIR\Sommerhus.Mvc"


      # Sæt site i "app_offline" tilstand for at undgå låste filer
      - name: Put API app offline
        run: New-Item -Path "$env:API_SITE_ROOT\app_offline.htm" -ItemType File -Force

      - name: Put MVC app offline
        run: New-Item -Path "$env:MVC_SITE_ROOT\app_offline.htm" -ItemType File -Force

      # (Valgfrit) Stop app pools for helt at frigive låse
      - name: Stop AppPools
        shell: pwsh
        run: |
          Import-Module WebAdministration
          Stop-WebAppPool -Name $env:API_APPPOOL
          Stop-WebAppPool -Name $env:MVC_APPPOOL

      # Kopiér med robocopy (hurtigt og sikkert)
      - name: Deploy API files
        run: |
          $src = "$env:PUBLISH_DIR\Sommerhus.Api"
          $dst = "$env:API_SITE_ROOT"
              # Persistente paths i destination som IKKE må røres
          $excludeDirs = @(
            Join-Path $dst 'wwwroot'
            Join-Path $dst 'Data'
            Join-Path $dst 'logs'
          )
          $excludeFiles = @(
            Join-Path $dst 'sommerhus.db'          # SQLite 
          )
          $roboArgs = @($src, $dst, '/MIR', '/R:1', '/W:1', '/NFL', '/NDL', '/NJH', '/NJS', '/NP')
          if ($excludeDirs) { $roboArgs += @('/XD'); $roboArgs += $excludeDirs }
          if ($excludeFiles){ $roboArgs += @('/XF'); $roboArgs += $excludeFiles }
          
          $null = robocopy $roboArgs
          $code = $LASTEXITCODE
          if ($code -gt 7) {
            exit 1
          } else {
            $global:LASTEXITCODE = 0   # <- vigtigt: nulstil så pwsh ikke afslutter med 3
            exit 0
          }
      - name: Deploy MVC files
        run:  |
          $src = "$env:PUBLISH_DIR\Sommerhus.Mvc"
          $dst = "$env:MVC_SITE_ROOT"
          $excludeDirs = @(
            Join-Path $dst 'wwwroot\uploads'
            Join-Path $dst 'Data'
            Join-Path $dst 'logs'
          )
          $excludeFiles = @(
            Join-Path $dst 'sommerhus.db'          # SQLite 
          )
          $roboArgs = @($src, $dst, '/MIR', '/R:1', '/W:1', '/NFL', '/NDL', '/NJH', '/NJS', '/NP')
          if ($excludeDirs) { $roboArgs += @('/XD'); $roboArgs += $excludeDirs }
          if ($excludeFiles){ $roboArgs += @('/XF'); $roboArgs += $excludeFiles }
          
          $null = robocopy $src $dst /MIR /R:1 /W:1
          $code = $LASTEXITCODE
          if ($code -gt 7) {
            exit 1
          } else {
            $global:LASTEXITCODE = 0   # <- vigtigt: nulstil så pwsh ikke afslutter med 3
            exit 0
          }
          
      # Start pools igen
      - name: Start AppPools
        shell: pwsh
        run: |
          Import-Module WebAdministration
          Start-WebAppPool -Name $env:API_APPPOOL
          Start-WebAppPool -Name $env:MVC_APPPOOL

      # Fjern app_offline.htm, så sites går live
      - name: Bring API online
        run: Remove-Item -Path "$env:API_SITE_ROOT\app_offline.htm" -ErrorAction SilentlyContinue

      - name: Bring MVC online
        run: Remove-Item -Path "$env:MVC_SITE_ROOT\app_offline.htm" -ErrorAction SilentlyContinue
